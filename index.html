<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>长晴手势实验岛</title>
  <link rel="stylesheet" href="src/styles.css" />
  <style>
    #fatal-error {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: #c82020; color:#fff; padding: 20px 30px; border-radius: 8px;
      font-family: "PingFang SC","Microsoft YaHei",sans-serif; font-size:14px;
      max-width:90%; text-align:center; z-index:9999;
    }
    #fatal-error b { display:block; margin-bottom:6px; font-size:16px; }
  </style>
</head>
<body>
  <noscript><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;color:#fff;padding:24px 32px;border-radius:8px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;text-align:center;z-index:9999;">本应用需要 JavaScript 支持，请在浏览器设置中启用 JavaScript。</div></noscript>
  <div id="fatal-error"><b>加载失败</b><span id="fatal-msg"></span></div>

  <div id="app" style="display:none">
    <div id="brand-bar">
      <span class="brand-logo">&#9670;</span>
      <span class="brand-divider"></span>
      <span class="brand-name-cn">上海长晴人工智能科技有限公司</span>
      <span class="brand-name-en">Changqing AI Technology (Shanghai) Co., Ltd.</span>
      <span class="brand-divider"></span>
      <nav id="tab-bar">
        <button class="tab-btn active" data-module="particles">粒子魔法</button>
        <button class="tab-btn" data-module="filters">魔法滤镜</button>
        <button class="tab-btn" data-module="paintings">我的画展</button>
        <button class="tab-btn" data-module="handwarp">手撕现实</button>
        <button class="tab-btn" data-module="lighttrails">光之轨迹</button>
        <button class="tab-btn" data-module="shadowplay">暗影剧场</button>
      </nav>
      <button id="theme-toggle" title="切换亮色/暗色主题">&#9788;</button>
      <button id="param-toggle" class="icon-btn" title="参数面板">&#9881;</button>
      <button id="project-toggle" class="icon-btn" title="我的作品">&#9733;</button>
    </div>
    <div id="canvas-container">
      <canvas id="three-canvas" class="module-canvas"></canvas>
      <canvas id="camera-canvas" class="module-canvas hidden"></canvas>
      <video id="camera-video" playsinline autoplay muted style="display:none"></video>
    </div>
    <div id="status-toast" class="toast hidden"></div>
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-spinner"></div>
      <p id="loading-text">正在加载 Three.js...</p>
    </div>
    <div id="hints-bar" class="hints-bar">
      <div class="gesture-demo" id="gesture-demo">
        <canvas id="gesture-anim-canvas" width="60" height="40"></canvas>
        <span class="gesture-demo__label" id="gesture-demo-label">张开</span>
        <span class="gesture-demo__hint" id="gesture-demo-hint">张开散开</span>
      </div>
      <span class="hints-divider">|</span>
      <span id="hints-text">←→ 切换样式 | D 演示 | C 摄像头 | S 截图 | M 静音 | ? 指南</span>
    </div>
    <div id="param-panel" class="overlay-panel overlay-panel--left hidden">
      <div class="overlay-panel__title">参数面板</div>
      <div id="param-panel-body"></div>
    </div>
    <div id="project-panel" class="overlay-panel overlay-panel--right hidden">
      <div class="overlay-panel__title">我的创作</div>
      <div class="project-create-row"><input id="project-title" maxlength="40" placeholder="给作品起个名字" /><button id="project-save" class="ctrl-btn">保存</button></div>
      <textarea id="project-note" maxlength="120" placeholder="写一句：我的作品会怎样变化？"></textarea>
      <div id="project-list"></div>
      <button id="project-variation" class="ctrl-btn project-variation-btn">从当前作品生成变奏</button>
    </div>
    <div id="hand-preview" class="overlay-panel overlay-panel--right hidden">
      <div class="overlay-panel__title">手部预览</div>
      <canvas id="hand-preview-canvas" width="160" height="90"></canvas>
    </div>
    <div id="bottom-bar">
      <div id="bar-left">
        <div id="preset-gallery" class="module-ui selector-panel"></div>
        <div id="filter-selector" class="module-ui selector-panel hidden"></div>
        <div id="painting-selector" class="module-ui selector-panel hidden"></div>
        <div id="warp-selector" class="module-ui selector-panel hidden"></div>
        <div id="trail-selector" class="module-ui selector-panel hidden"></div>
        <div id="shadow-selector" class="module-ui selector-panel hidden"></div>
      </div>
      <div id="bar-center">
        <span id="gesture-status" class="status-dot offline"></span>
        <span id="status-text">加载中...</span>
        <span id="fps-display" class="fps"></span>
      </div>
      <div id="bar-right">
        <button id="btn-camera" class="ctrl-btn">启动摄像头</button>
        <button id="btn-demo" class="ctrl-btn">演示模式</button>
        <button id="btn-reset" class="ctrl-btn">重置</button>
        <select id="sound-theme" class="ctrl-select" title="作品氛围音">
          <option value="none">无氛围</option>
          <option value="dream">梦境</option>
          <option value="space">星空</option>
          <option value="forest">森林</option>
          <option value="magic">魔法</option>
        </select>
        <button id="btn-inspire" class="ctrl-btn" title="随机生成颜色、造型和声音灵感">灵感变奏</button>
        <button id="btn-screenshot" class="ctrl-btn" title="截图 (S)">拍照</button>
        <button id="btn-mute" class="ctrl-btn" title="静音 (M)">声音</button>
        <button id="btn-challenge" class="ctrl-btn" title="挑战模式">挑战</button>
        <div class="slider-group">
          <label for="smoothing-slider">平滑度</label>
          <input type="range" id="smoothing-slider" min="0.1" max="0.9" step="0.05" value="0.35" />
        </div>
      </div>
    </div>
    <div id="challenge-bar" class="challenge-bar hidden">
      <span id="challenge-gesture-icon"></span>
      <span id="challenge-gesture-label"></span>
      <span id="challenge-score">得分: 0</span>
      <span id="challenge-combo"></span>
      <span id="challenge-timer"></span>
      <button id="btn-challenge-stop" class="ctrl-btn">结束挑战</button>
    </div>
  </div>

  <!-- Step 1: Load THREE.js (classic script, sets window.THREE) -->
  <script>
  function fatal(msg) {
    document.getElementById('fatal-msg').textContent = msg;
    document.getElementById('fatal-error').style.display = 'block';
    document.getElementById('loading-overlay').style.display = 'none';
  }

  function loadScript(url) {
    return new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function() { reject(new Error('script load failed: ' + url)); };
      document.head.appendChild(s);
    });
  }

  var CDN = 'https://cdn.jsdelivr.net/npm/three@0.157.0';
  var FALLBACK = 'https://unpkg.com/three@0.157.0';

  async function boot() {
    document.getElementById('loading-text').textContent = '正在加载 Three.js (CDN)...';

    // Load THREE.js with fallback
    try {
      await loadScript(CDN + '/build/three.min.js');
    } catch(e) {
      try {
        document.getElementById('loading-text').textContent = '主CDN不可用，尝试备用CDN...';
        await loadScript(FALLBACK + '/build/three.min.js');
      } catch(e2) {
        fatal('无法从网络加载 Three.js 库。\n请检查网络连接，或联系技术支持。\n\n(' + e.message + ')');
        return;
      }
    }

    // Verify THREE is loaded
    if (!window.THREE || !window.THREE.Scene) {
      fatal('Three.js 加载不完整，请刷新页面重试。');
      return;
    }

    console.log('THREE r' + (window.THREE.REVISION || '?') + ' loaded');

    // Step 2: Load app.js immediately — addons load in background
    document.getElementById('loading-text').textContent = '正在初始化应用...';

    // Non-blocking addon loading
    var addonCDN = 'https://cdn.jsdelivr.net/npm/three@0.157.0';
    var addonFallback = 'https://unpkg.com/three@0.157.0';
    loadScript(addonCDN + '/examples/js/controls/OrbitControls.js').catch(function() {
      return loadScript(addonFallback + '/examples/js/controls/OrbitControls.js').catch(function() {})
    });
    loadScript(addonCDN + '/examples/js/loaders/GLTFLoader.js').catch(function() {
      return loadScript(addonFallback + '/examples/js/loaders/GLTFLoader.js').catch(function() {})
    });

    try {
      var appScript = document.createElement('script');
      appScript.type = 'module';
      appScript.src = 'src/app.js';
      document.head.appendChild(appScript);
    } catch(e) {
      fatal('应用加载失败: ' + (e.message || '未知错误'));
      return;
    }
  }

  boot();
  </script>
</body>
</html>
