<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>粒子交互AI教学 | 长晴科技</title>
  <link rel="stylesheet" href="src/styles.css" />
  <style>
    #fatal-error {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: #c82020; color:#fff; padding: 20px 30px; border-radius: 8px;
      font-family: "PingFang SC","Microsoft YaHei",sans-serif; font-size:14px;
      max-width:90%; text-align:center; z-index:9999;
    }
    #fatal-error b { display:block; margin-bottom:6px; font-size:16px; }
  </style>
</head>
<body>
  <div id="fatal-error"><b>加载失败</b><span id="fatal-msg"></span></div>

  <div id="app" style="display:none">
    <div id="brand-bar">
      <span class="brand-logo">&#9670;</span>
      <span class="brand-divider"></span>
      <span class="brand-name-cn">上海长晴人工智能科技有限公司</span>
      <span class="brand-name-en">Changqing AI Technology (Shanghai) Co., Ltd.</span>
    </div>
    <nav id="tab-bar">
      <button class="tab-btn active" data-module="particles">粒子魔法</button>
      <button class="tab-btn" data-module="filters">魔法滤镜</button>
      <button class="tab-btn" data-module="paintings">我的画展</button>
      <button id="param-toggle" class="icon-btn" title="参数面板">&#9881;</button>
    </nav>
    <div id="canvas-container">
      <canvas id="three-canvas" class="module-canvas"></canvas>
      <canvas id="camera-canvas" class="module-canvas hidden"></canvas>
      <video id="camera-video" playsinline autoplay muted style="display:none"></video>
    </div>
    <div id="status-toast" class="toast hidden"></div>
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-spinner"></div>
      <p id="loading-text">正在加载 Three.js...</p>
    </div>
    <div id="bottom-bar">
      <div id="bar-left">
        <div id="preset-gallery" class="module-ui"></div>
        <div id="filter-selector" class="module-ui hidden"></div>
        <div id="painting-selector" class="module-ui hidden"></div>
      </div>
      <div id="bar-center">
        <span id="gesture-status" class="status-dot offline"></span>
        <span id="status-text">加载中...</span>
        <span id="fps-display" class="fps"></span>
      </div>
      <div id="bar-right">
        <button id="btn-camera" class="ctrl-btn">启动摄像头</button>
        <button id="btn-demo" class="ctrl-btn">演示模式</button>
        <button id="btn-reset" class="ctrl-btn">重置</button>
        <div class="slider-group">
          <label for="smoothing-slider">平滑度</label>
          <input type="range" id="smoothing-slider" min="0.1" max="0.9" step="0.05" value="0.35" />
        </div>
      </div>
    </div>
    <div id="param-panel" class="param-panel hidden"></div>
  </div>

  <!-- Step 1: Load THREE.js (classic script, sets window.THREE) -->
  <script>
  function fatal(msg) {
    document.getElementById('fatal-msg').textContent = msg;
    document.getElementById('fatal-error').style.display = 'block';
    document.getElementById('loading-overlay').style.display = 'none';
  }

  function loadScript(url) {
    return new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function() { reject(new Error('script load failed: ' + url)); };
      document.head.appendChild(s);
    });
  }

  var CDN = 'https://cdn.jsdelivr.net/npm/three@0.157.0';
  var FALLBACK = 'https://unpkg.com/three@0.157.0';

  async function boot() {
    document.getElementById('loading-text').textContent = '正在加载 Three.js (CDN)...';

    // Load THREE.js with fallback
    try {
      await loadScript(CDN + '/build/three.min.js');
    } catch(e) {
      try {
        document.getElementById('loading-text').textContent = '主CDN不可用，尝试备用CDN...';
        await loadScript(FALLBACK + '/build/three.min.js');
      } catch(e2) {
        fatal('无法从网络加载 Three.js 库。\n请检查网络连接，或联系技术支持。\n\n(' + e.message + ')');
        return;
      }
    }

    // Load addons
    document.getElementById('loading-text').textContent = '正在加载插件...';
    try {
      await Promise.all([
        loadScript(CDN + '/examples/jsm/controls/OrbitControls.js'),
        loadScript(CDN + '/examples/jsm/loaders/GLTFLoader.js'),
      ]);
    } catch(e) {
      console.warn('Addon load failed (non-critical):', e.message);
    }

    // Verify THREE is loaded
    if (!window.THREE || !window.THREE.Scene) {
      fatal('Three.js 加载不完整，请刷新页面重试。');
      return;
    }

    console.log('THREE r' + (window.THREE.REVISION || '?') + ' loaded');

    // Step 2: Load app.js
    document.getElementById('loading-text').textContent = '正在初始化应用...';
    try {
      var appScript = document.createElement('script');
      appScript.type = 'module';
      appScript.src = 'src/app.js';
      document.head.appendChild(appScript);
    } catch(e) {
      fatal('应用加载失败: ' + (e.message || '未知错误'));
      return;
    }
  }

  boot();
  </script>
</body>
</html>
